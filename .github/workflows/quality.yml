name: Required quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: repository-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema[format]>=4.23,<5"

      - name: Run schema and domain-rule tests
        run: python tests/validate_repository.py

      - name: Build self-contained public site
        run: npm run build

      - name: Validate built product identity and architecture
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          grep -Fq 'data-product="the-epstein-record-public-reference"' dist/index.html
          grep -Fq 'Evidence before narrative.' dist/index.html
          if grep -Eqi 'Log in to Vercel|/_next/|DecompressionStream|document\.write[[:space:]]*\(|\batob[[:space:]]*\(' dist/index.html; then
            echo 'Prohibited framework, authentication, or browser-bootstrap content detected.'
            exit 1
          fi

      - name: Validate local Markdown links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          import re, sys

          root = Path.cwd()
          errors = []
          pattern = re.compile(r'!?\[[^\]]*\]\(([^)]+)\)')
          for path in root.rglob('*.md'):
              for raw in pattern.findall(path.read_text(encoding='utf-8')):
                  target = raw.strip().split(' "', 1)[0].strip('<>')
                  if not target or target.startswith(('#', 'http://', 'https://', 'mailto:')):
                      continue
                  clean = unquote(urlsplit(target).path)
                  candidate = (root / clean.lstrip('/')) if clean.startswith('/') else (path.parent / clean)
                  if not candidate.exists():
                      errors.append(f'{path}: missing local target {target}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Local Markdown links passed.')
          PY
