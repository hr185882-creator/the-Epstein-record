name: Validate static production build

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/build-static.mjs"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/materialize-production.yml"
  pull_request:
    paths:
      - "public/**"
      - "scripts/build-static.mjs"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/materialize-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build self-contained static output
        run: npm run build

      - name: Validate production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -qi '<main' dist/index.html
          grep -q 'data-product="the-epstein-record-public-reference"' dist/index.html
          grep -q 'Evidence before narrative' dist/index.html
          grep -q 'Fictional schema examples' dist/index.html
          ! grep -qi 'Log in to Vercel' dist/index.html
          ! grep -qi 'vercel.com/login' dist/index.html
          ! grep -q '/_next/' dist/index.html
          ! grep -q 'DecompressionStream' dist/index.html
          ! grep -q 'document.write(' dist/index.html
          ! grep -q 'atob(' dist/index.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          echo "Static production artifact passed all identity and integrity checks."
