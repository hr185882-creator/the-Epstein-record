name: Validate static deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build self-contained static site
        run: npm run build
      - name: Verify required output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          ! grep -q '/_next/' dist/index.html
          ! grep -Eq 'DecompressionStream|document\.write\s*\(|\batob\s*\(' dist/index.html
          grep -qi '<main' dist/index.html
          grep -qi 'The Epstein Record' dist/index.html
